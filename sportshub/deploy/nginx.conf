    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # ---- React frontend (static build) ----
    root /var/www/sportshub/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- Flask API (proxied to gunicorn over a unix socket) ----
    location /api/ {
        proxy_pass http://unix:/var/www/sportshub/backend/sportshub.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 10M;
}
